<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conecta - NSQK</title>

    <style>
        /* BASE */
        body {
            background: radial-gradient(circle, #1e3c72 0%, #0f1c3f 100%);
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 50px 20px;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .subtitulo {
            color: #8da9c4;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* CONTENEDOR DE BOTONES */
        .links-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ESTILO BASE DE BOTONES */
        .btn-link {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-link:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        /* COLORES DE PLATAFORMAS */
        .spotify { background: #1DB954; box-shadow: 0 5px 15px rgba(29, 185, 84, 0.3); }
        .apple { background: #fc3c44; box-shadow: 0 5px 15px rgba(252, 60, 68, 0.3); }
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .youtube { background: #FF0000; }
        .tiktok { background: #000000; border: 1px solid #fff; }

        /* COLLAGE / IMAGEN */
        .collage-container {
            margin: 50px auto;
            max-width: 600px;
        }

        .collage-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* BOTÓN ESTRELLA */
        .contenedor-regresar {
            margin-top: 60px;
            display: flex;
            justify-content: center;
        }

        .btn-estrella {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            background: black;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            transition: transform 0.4s ease;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 2px white);
        }

        .btn-estrella:hover {
            transform: scale(1.15) rotate(-15deg);
        }
    </style>
</head>

<body>

    <h1>CONECTA</h1>
    <p class="subtitulo">Sigue a NSQK en todas sus plataformas oficiales</p>

    <div class="links-container">
        <a href="https://open.spotify.com/intl-es/artist/1jtvmXiemNFkPO11NMdjfu" target="_blank" class="btn-link spotify">
            <span>Spotify 🎧</span>
        </a>

        <a href="https://music.apple.com/mx/artist/nsqk/1480741185"_blank" class="btn-link apple">
            <span>Apple Music 🍎</span>
        </a>

        <a href="https://www.instagram.com/nsqkk/" target="_blank" class="btn-link instagram">
            <span>Instagram 📸</span>
        </a>

        <a href="https://www.youtube.com/@Nsqkk" target="_blank" class="btn-link youtube">
            <span>YouTube 📺</span>
        </a>
    </div>

    <div class="collage-container">
        <img src="img/final.jpg" alt="NSQK Collage">
    </div>

    <div class="contenedor-regresar">
        <a href="index.html" class="btn-estrella">
            <span>REGRESAR <br> AL MENÚ</span>
        </a>
    </div>

</body>
</html>
